name: Deploy AI Ops Agent

on:
  workflow_call:
    secrets:
      DEPLOY_WEBHOOK_URL:
        required: true
      DEPLOY_WEBHOOK_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate deploy webhook settings
        shell: python
        run: |
          import os
          import sys
          from urllib.parse import urlparse

          url = os.environ.get("DEPLOY_WEBHOOK_URL", "")
          token = os.environ.get("DEPLOY_WEBHOOK_TOKEN", "")
          parsed = urlparse(url)

          checks = [
              (bool(url), "DEPLOY_WEBHOOK_URL is empty"),
              (parsed.scheme == "https", "DEPLOY_WEBHOOK_URL must use https://"),
              (bool(parsed.hostname), "DEPLOY_WEBHOOK_URL must include a host name"),
              (
                  not parsed.username and not parsed.password,
                  "DEPLOY_WEBHOOK_URL must not contain credentials",
              ),
              (
                  parsed.path == "/hooks/ai-ops-agent-update",
                  "DEPLOY_WEBHOOK_URL path must be /hooks/ai-ops-agent-update",
              ),
              (
                  not parsed.query and not parsed.fragment,
                  "DEPLOY_WEBHOOK_URL must not contain a query string; "
                  "the secret goes in DEPLOY_WEBHOOK_TOKEN",
              ),
              (bool(token), "DEPLOY_WEBHOOK_TOKEN is empty"),
          ]

          errors = [message for ok, message in checks if not ok]
          if errors:
              for message in errors:
                  print(f"::error::{message}")
              sys.exit(1)

          print("Deploy webhook settings OK")
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}

      - name: Call deploy webhook
        # --proto/--proto-redir refuse plain HTTP, including on redirects;
        # --max-redirs 0 turns any redirect into a failure instead of a retry.
        run: |
          echo "::add-mask::$DEPLOY_WEBHOOK_TOKEN"
          curl --fail --show-error --silent \
            --location --max-redirs 0 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -X POST \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
            "$DEPLOY_WEBHOOK_URL"
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
